<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Excel to Management Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F3F5F8;--surface:#FFFFFF;--ink:#14213D;--muted:#5B6B82;--line:#DDE3EC;
  --navy:#1F3A68;--teal:#0F8B8D;--gold:#C9962B;--rose:#B5486A;--sage:#6B9080;--sky:#5B8DB8;
  --pos:#12805C;--neg:#B42318;--hero:#14213D;--hero-ink:#F3F5F8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1626;--surface:#16213A;--ink:#E8EDF5;--muted:#93A2BA;--line:#27355A;
  --navy:#7FA3DB;--teal:#3CC0C2;--gold:#E3B54F;--rose:#E07A9B;--sage:#8DB5A2;--sky:#7FB3E0;
  --pos:#4CC59A;--neg:#F47C70;--hero:#1B2B4D;--hero-ink:#E8EDF5;}}
:root[data-theme="dark"]{
  --bg:#0E1626;--surface:#16213A;--ink:#E8EDF5;--muted:#93A2BA;--line:#27355A;
  --navy:#7FA3DB;--teal:#3CC0C2;--gold:#E3B54F;--rose:#E07A9B;--sage:#8DB5A2;--sky:#7FB3E0;
  --pos:#4CC59A;--neg:#F47C70;--hero:#1B2B4D;--hero-ink:#E8EDF5;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
.wrap{width:100%;max-width:none;margin:0;padding:clamp(12px,2vw,28px) clamp(12px,2.5vw,40px) 56px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-weight:600;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,select{font:inherit;color:var(--ink)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1626}
.btn:focus-visible,select:focus-visible,.drop:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.drop{border:2px dashed var(--line);border-radius:14px;background:var(--surface);padding:44px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop.over,.drop:hover{border-color:var(--teal)}
.drop h2{margin:0 0 6px;font:600 22px "IBM Plex Serif",serif}
.drop p{margin:0 0 16px;color:var(--muted)}
.err{color:var(--neg);margin-top:12px;min-height:1em}
#report{display:none}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:14px;padding:26px 28px;margin-bottom:16px}
.hero h1{margin:0;font:600 30px/1.2 "IBM Plex Serif",serif;outline:none}
.hero .sub{opacity:.75;margin-top:6px}
.controls{display:flex;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
.controls label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px;min-width:140px;flex:1}
.controls select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;border-top:3px solid var(--teal)}
.kpi:nth-child(2){border-top-color:var(--navy)}.kpi:nth-child(3){border-top-color:var(--gold)}.kpi:nth-child(4){border-top-color:var(--rose)}.kpi:nth-child(5){border-top-color:var(--sage)}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font:600 28px/1.2 "IBM Plex Serif",serif;margin:4px 0 2px;overflow-wrap:anywhere}
.kpi .d{font-size:13px;color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:12px}
.grid.even{grid-template-columns:1fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 10px;font-size:16px;font-weight:600}
.ch{position:relative;height:clamp(260px,36vh,440px)}
.insights{margin:0;padding-left:18px}
.insights li{margin-bottom:6px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;background:var(--bg)}
.foot{color:var(--muted);font-size:12.5px;margin-top:14px}
@media(max-width:1000px){.grid,.grid.even{grid-template-columns:1fr}}
@media(max-width:820px){.hero{padding:20px}.hero h1{font-size:24px}}
@media(max-width:560px){.controls{padding:10px;gap:10px}.controls label{min-width:calc(50% - 5px)}.kpi{padding:12px 14px}.kpi .v{font-size:22px}.card{padding:12px}.ch{height:250px}header.top{flex-direction:column;align-items:stretch}.actions .btn{flex:1}.drop{padding:32px 14px}.hero h1{font-size:21px}}
@media print{
  body{background:#fff}.actions,.controls,#dropWrap{display:none!important}
  .card,.kpi{break-inside:avoid}.wrap{padding:0}
  .hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Management Reporting</div>
    <div class="actions">
      <button class="btn" id="sampleBtn">Load sample data</button>
      <button class="btn" id="themeBtn">Switch theme</button>
      <button class="btn primary" id="printBtn" style="display:none">Print or save as PDF</button>
    </div>
  </header>

  <section id="dropWrap">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Upload an Excel or CSV file">
      <h2>Drop your Excel file here</h2>
      <p>Supports .xlsx, .xls and .csv. Your data stays in your browser and is never uploaded.</p>
      <button class="btn primary" type="button" id="pick">Choose file</button>
      <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
      <div class="err" id="err" role="alert"></div>
    </div>
  </section>

  <section id="report">
    <div class="hero">
      <h1 id="title" contenteditable="true" spellcheck="false">Performance report</h1>
      <div class="sub" id="subtitle"></div>
    </div>

    <div class="controls">
      <label>Sheet<select id="sheet"></select></label>
      <label>Date column<select id="dateCol"></select></label>
      <label>Category column<select id="catCol"></select></label>
      <label>Metric column<select id="valCol"></select></label>
      <label>Calculation<select id="agg"><option value="sum">Total</option><option value="avg">Average</option><option value="count">Count</option></select></label>
      <label>Filter category<select id="filter"></select></label>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="grid">
      <div class="card"><h3 id="trendT">Trend over time</h3><div class="ch"><canvas id="trend"></canvas></div></div>
      <div class="card"><h3>Key takeaways</h3><ul class="insights" id="insights"></ul></div>
    </div>
    <div class="grid even">
      <div class="card"><h3 id="barT">By category</h3><div class="ch"><canvas id="bar"></canvas></div></div>
      <div class="card"><h3>Share of total</h3><div class="ch"><canvas id="pie"></canvas></div></div>
    </div>
    <div class="card"><h3>Data preview (first 10 rows)</h3><div class="scroll"><table id="tbl"></table></div></div>
    <div class="foot" id="foot"></div>
  </section>
</div>

<script>
var wb=null,rows=[],cols=[],types={},charts={};
var $=function(i){return document.getElementById(i)};
var PAL=['--teal','--navy','--gold','--rose','--sage','--sky'];
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function fmt(n){if(n==null||isNaN(n))return '–';var a=Math.abs(n);
  if(a>=1e9)return (n/1e9).toFixed(2)+'B';if(a>=1e6)return (n/1e6).toFixed(2)+'M';
  if(a>=1e4)return (n/1e3).toFixed(1)+'K';return n.toLocaleString(undefined,{maximumFractionDigits:2})}

/* Loading */
function handleFile(f){
  $('err').textContent='';
  var r=new FileReader();
  r.onload=function(e){
    try{wb=XLSX.read(e.target.result,{type:'array',cellDates:true});setupSheets()}
    catch(x){$('err').textContent='This file could not be read. Check that it is a valid .xlsx, .xls or .csv file.'}
  };
  r.readAsArrayBuffer(f);
}
function setupSheets(){
  var s=$('sheet');s.innerHTML='';
  wb.SheetNames.forEach(function(n){var o=document.createElement('option');o.value=o.textContent=n;s.appendChild(o)});
  loadSheet();
}
function loadSheet(){
  var data=XLSX.utils.sheet_to_json(wb.Sheets[$('sheet').value],{defval:null,raw:true});
  if(!data.length){$('err').textContent='This sheet is empty. Pick a sheet with a header row and data.';return}
  rows=data;cols=Object.keys(data[0]);
  cols.forEach(function(c){types[c]=detect(c)});
  fillSelect('dateCol',cols.filter(function(c){return types[c]=='date'}),true);
  fillSelect('catCol',cols.filter(function(c){return types[c]=='cat'}),true);
  fillSelect('valCol',cols.filter(function(c){return types[c]=='num'}),false);
  $('dropWrap').style.display='none';$('report').style.display='block';$('printBtn').style.display='';
  fillFilter();render();
}
function detect(c){
  var v=rows.slice(0,200).map(function(r){return r[c]}).filter(function(x){return x!=null&&x!==''});
  if(!v.length)return 'cat';
  var d=v.filter(function(x){return x instanceof Date}).length;
  var n=v.filter(function(x){return typeof x=='number'}).length;
  if(d/v.length>.8)return 'date';
  if(n/v.length>.8)return 'num';
  return 'cat';
}
function fillSelect(id,list,allowNone){
  var s=$(id);s.innerHTML='';
  if(allowNone){var o=document.createElement('option');o.value='';o.textContent='None';s.appendChild(o)}
  list.forEach(function(c){var o=document.createElement('option');o.value=o.textContent=c;s.appendChild(o)});
  if(list.length)s.value=list[0];
}
function fillFilter(){
  var c=$('catCol').value,s=$('filter');s.innerHTML='<option value="">All</option>';
  if(!c)return;
  var u=[];rows.forEach(function(r){var x=r[c];if(x!=null&&u.indexOf(String(x))<0)u.push(String(x))});
  u.sort().slice(0,100).forEach(function(x){var o=document.createElement('option');o.value=o.textContent=x;s.appendChild(o)});
}

/* Aggregation */
function agg(list,vc,kind){
  if(kind=='count')return list.length;
  var nums=list.map(function(r){return Number(r[vc])}).filter(function(x){return !isNaN(x)});
  if(!nums.length)return 0;
  var t=nums.reduce(function(a,b){return a+b},0);
  return kind=='avg'?t/nums.length:t;
}
function group(list,keyFn,vc,kind){
  var m={};list.forEach(function(r){var k=keyFn(r);if(k==null)return;(m[k]=m[k]||[]).push(r)});
  return Object.keys(m).map(function(k){return {k:k,v:agg(m[k],vc,kind),n:m[k].length}});
}
function mkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}

/* Render */
function render(){
  var dc=$('dateCol').value,cc=$('catCol').value,vc=$('valCol').value,kind=$('agg').value,f=$('filter').value;
  if(!vc&&kind!='count'){kind='count';$('agg').value='count'}
  var list=rows.filter(function(r){return !f||String(r[cc])===f});
  var label=(kind=='sum'?'Total ':kind=='avg'?'Average ':'Count of ')+(vc||'records');
  $('subtitle').textContent=label+(f?' for '+f:'')+' · '+list.length.toLocaleString()+' records';

  // KPIs
  var total=agg(list,vc,kind),avg=agg(list,vc,'avg');
  var cats=cc?group(list,function(r){return r[cc]==null?null:String(r[cc])},vc,kind).sort(function(a,b){return b.v-a.v}):[];
  var months=dc?group(list,function(r){return r[dc] instanceof Date?mkey(r[dc]):null},vc,kind).sort(function(a,b){return a.k<b.k?-1:1}):[];
  var growth=null;
  if(months.length>1){var a=months[months.length-2].v,b=months[months.length-1].v;if(a)growth=(b-a)/Math.abs(a)*100}
  var k=[
    {l:'Records',v:list.length.toLocaleString(),d:cols.length+' columns analysed'},
    {l:label,v:fmt(total),d:'Across the selected data'},
    {l:'Average per record',v:fmt(avg),d:vc?'Mean of '+vc:'Select a metric'},
    {l:'Top category',v:cats.length?cats[0].k:'–',d:cats.length?fmt(cats[0].v)+' ('+(cats.length>0&&total?Math.round(cats[0].v/cats.reduce(function(s,x){return s+x.v},0)*100):0)+'% of total)':'Select a category'},
    {l:'Latest month change',v:growth==null?'–':(growth>=0?'+':'')+growth.toFixed(1)+'%',d:months.length>1?months[months.length-1].k+' vs '+months[months.length-2].k:'Needs a date column',cls:growth==null?'':growth>=0?'pos':'neg'}
  ];
  $('kpis').innerHTML=k.map(function(x){return '<div class="kpi"><div class="l">'+x.l+'</div><div class="v '+(x.cls||'')+'">'+x.v+'</div><div class="d">'+x.d+'</div></div>'}).join('');

  // Charts
  var grid=css('--line'),txt=css('--muted');
  Chart.defaults.color=txt;Chart.defaults.font.family='"IBM Plex Sans",sans-serif';
  Object.keys(charts).forEach(function(c){charts[c].destroy()});charts={};
  var opt={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}};
  var sc={x:{grid:{display:false}},y:{grid:{color:grid},ticks:{callback:function(v){return fmt(v)}}}};
  $('trendT').textContent=dc?label+' by month':'Trend over time';
  if(months.length){
    charts.t=new Chart($('trend'),{type:'line',data:{labels:months.map(function(m){return m.k}),
      datasets:[{data:months.map(function(m){return m.v}),borderColor:css('--teal'),backgroundColor:css('--teal')+'22',fill:true,tension:.3,pointRadius:3,borderWidth:2.5}]},options:Object.assign({},opt,{scales:sc})});
  }
  var top=cats.slice(0,10);
  $('barT').textContent=cc?label+' by '+cc:'By category';
  if(top.length){
    charts.b=new Chart($('bar'),{type:'bar',data:{labels:top.map(function(c){return c.k}),
      datasets:[{data:top.map(function(c){return c.v}),backgroundColor:css('--navy'),borderRadius:5}]},options:Object.assign({},opt,{indexAxis:'y',scales:{x:{grid:{color:grid},ticks:{callback:function(v){return fmt(v)}}},y:{grid:{display:false}}}})});
    var p=cats.slice(0,6),rest=cats.slice(6).reduce(function(s,x){return s+x.v},0);
    var lab=p.map(function(c){return c.k}),val=p.map(function(c){return c.v});
    if(rest>0){lab.push('Other');val.push(rest)}
    charts.p=new Chart($('pie'),{type:'doughnut',data:{labels:lab,datasets:[{data:val,backgroundColor:lab.map(function(_,i){return css(PAL[i%6])}),borderColor:css('--surface'),borderWidth:2}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:12}}}}});
  }

  // Insights
  var ins=[];
  if(cats.length){var sum=cats.reduce(function(s,x){return s+x.v},0);
    ins.push('<b>'+cats[0].k+'</b> leads with '+fmt(cats[0].v)+(sum?', about '+Math.round(cats[0].v/sum*100)+'% of the total':'')+'.');
    if(cats.length>1)ins.push('<b>'+cats[cats.length-1].k+'</b> is lowest at '+fmt(cats[cats.length-1].v)+'.')}
  if(months.length>1){var best=months.slice().sort(function(a,b){return b.v-a.v})[0],worst=months.slice().sort(function(a,b){return a.v-b.v})[0];
    ins.push('Strongest month was <b>'+best.k+'</b> ('+fmt(best.v)+'); weakest was <b>'+worst.k+'</b> ('+fmt(worst.v)+').');
    if(growth!=null)ins.push('The latest month is <b class="'+(growth>=0?'pos':'neg')+'">'+(growth>=0?'up ':'down ')+Math.abs(growth).toFixed(1)+'%</b> on the month before.')}
  if(!ins.length)ins.push('Choose a date, category and metric column above to generate takeaways.');
  $('insights').innerHTML=ins.map(function(x){return '<li>'+x+'</li>'}).join('');

  // Table
  var head='<tr>'+cols.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr>';
  var body=list.slice(0,10).map(function(r){return '<tr>'+cols.map(function(c){var v=r[c];
    if(v instanceof Date)v=v.toISOString().slice(0,10);return '<td>'+esc(v==null?'':v)+'</td>'}).join('')+'</tr>'}).join('');
  $('tbl').innerHTML=head+body;
  $('foot').textContent='Generated '+new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})+' from '+$('sheet').value+'.';
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* Sample data */
function sample(){
  var regions=['Doha','Al Rayyan','Al Wakrah','Lusail','Al Khor'],prods=['Hardware','Software','Services'],out=[],seed=7;
  function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
  for(var m=0;m<12;m++)for(var i=0;i<22;i++){
    var r=regions[Math.floor(rnd()*5)],p=prods[Math.floor(rnd()*3)];
    out.push({Date:new Date(2026,m,1+Math.floor(rnd()*27)),Region:r,Product:p,Units:Math.round(5+rnd()*40),Revenue:Math.round((800+rnd()*4200)*(1+m*.04)*(r=='Doha'?1.5:1))});
  }
  var ws=XLSX.utils.json_to_sheet(out);wb={SheetNames:['Sales 2026'],Sheets:{'Sales 2026':ws}};
  $('title').textContent='Sales performance 2026';setupSheets();
  $('catCol').value='Region';$('valCol').value='Revenue';fillFilter();render();
}

/* Events */
$('pick').onclick=function(e){e.stopPropagation();$('file').click()};
$('drop').onclick=function(){$('file').click()};
$('drop').onkeydown=function(e){if(e.key=='Enter'||e.key==' '){e.preventDefault();$('file').click()}};
$('file').onchange=function(e){if(e.target.files[0]){handleFile(e.target.files[0]);$('title').textContent=e.target.files[0].name.replace(/\.[^.]+$/,'')+' report'}};
['dragover','dragenter'].forEach(function(t){$('drop').addEventListener(t,function(e){e.preventDefault();$('drop').classList.add('over')})});
['dragleave','drop'].forEach(function(t){$('drop').addEventListener(t,function(e){e.preventDefault();$('drop').classList.remove('over')})});
$('drop').addEventListener('drop',function(e){var f=e.dataTransfer.files[0];if(f){handleFile(f);$('title').textContent=f.name.replace(/\.[^.]+$/,'')+' report'}});
$('sampleBtn').onclick=sample;
$('printBtn').onclick=function(){window.print()};
$('sheet').onchange=loadSheet;
['dateCol','valCol','agg','filter'].forEach(function(i){$(i).onchange=render});
$('catCol').onchange=function(){fillFilter();render()};
$('themeBtn').onclick=function(){
  var r=document.documentElement,dark=r.getAttribute('data-theme')?r.getAttribute('data-theme')=='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.setAttribute('data-theme',dark?'light':'dark');if(rows.length)render();
};
</script>
</body>
</html>
